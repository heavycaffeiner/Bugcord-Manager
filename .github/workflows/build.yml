name: Build Debug App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Fetch Bugcord libraries
        run: |
          fetch() {
            mkdir -p "$(dirname "$2")"
            curl -fsSL --retry 3 -o "$2" "$1"
          }

          repo="https://github.com/thirdscam"
          fetch "$repo/Bugcord-axml/releases/download/1.0.1/axml-1.0.1.jar" \
            local-repo/com/bugcord/axml/1.0.1/axml-1.0.1.jar
          fetch "$repo/Bugcord-axml/releases/download/1.0.1/axml-1.0.1.pom" \
            local-repo/com/bugcord/axml/1.0.1/axml-1.0.1.pom
          fetch "$repo/Bugcord-binary-resources/releases/download/2.1.0/binary-resources-2.1.0.aar" \
            local-repo/com/bugcord/binary-resources/2.1.0/binary-resources-2.1.0.aar
          fetch "$repo/Bugcord-binary-resources/releases/download/2.1.0/binary-resources-2.1.0.pom" \
            local-repo/com/bugcord/binary-resources/2.1.0/binary-resources-2.1.0.pom
          fetch "$repo/Bugcord-binary-resources/releases/download/2.1.0/binary-resources-2.1.0.module" \
            local-repo/com/bugcord/binary-resources/2.1.0/binary-resources-2.1.0.module
          fetch "$repo/Bugcord-libsu/releases/download/6.0.0/core-6.0.0.aar" \
            local-repo/com/bugcord/libsu/core/6.0.0/core-6.0.0.aar
          fetch "$repo/Bugcord-libsu/releases/download/6.0.0/core-6.0.0.pom" \
            local-repo/com/bugcord/libsu/core/6.0.0/core-6.0.0.pom
          fetch "$repo/Bugcord-libsu/releases/download/6.0.0/core-6.0.0.module" \
            local-repo/com/bugcord/libsu/core/6.0.0/core-6.0.0.module

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug :app:assembleStaging --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/staging/app-staging.apk
